<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Middle C">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111113">
<title>Middle C</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#fff,#141417);--ink:light-dark(#141417,#ecebe8);--soft:light-dark(#6b6a70,#a3a2a8);--line:light-dark(#e4e3e6,#2c2c33);--card:light-dark(#fff,#1b1b20);--felt:#b5122b;--feltSoft:light-dark(#fbe3e6,#3a1219);--ok:#23955a;--miss:#e0761c;--heard:#2a6fd8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif}
header{background:#111113;color:#fff;padding:12px 16px;border-bottom:5px solid var(--felt);display:flex;align-items:center}.brand{font:28px Georgia,serif}
main{max-width:900px;margin:40px auto;padding:20px}.card{border:1px solid var(--line);background:var(--card);border-radius:18px;padding:24px;text-align:center}
.big{font:72px Georgia,serif;color:var(--felt)}
</style>
</head>
<body>
<header><div class="brand">Middle C</div></header>
<main><section class="card"><h1>Middle C Piano Practice</h1><p>Your uploaded page is ready.</p><div class="big">C</div></main>
</body>
</html>
